<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> </title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; background: #0c0d0e; }

  body {
    font-family: 'Courier New', Courier, monospace;
    position: relative;
    user-select: none;
  }

  /* the CRT "tube" holds the grey feed + screen artifacts; jitters occasionally */
  .tube {
    position: fixed;
    inset: 0;
    z-index: 0;
    isolation: isolate;          /* contain blend modes so they can't flash across layers */
    animation: glitchJitter 7s steps(1) infinite;
  }

  @keyframes glitchJitter {
    0%, 90%, 100% { transform: translate(0,0); }
    91% { transform: translate(-4px, 1px); }
    92% { transform: translate(5px, -2px); }
    93% { transform: translate(-2px, 2px); }
    94% { transform: translate(2px, 0); }
  }

  /* grey camcorder feed (blocky pixels) */
  #feed {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* phosphor pixel grid + scanlines */
  /* pixel grid + scanlines as plain dark lines (no blend mode) */
  .crt {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.16) 2px, rgba(0,0,0,0.16) 3px),
      repeating-linear-gradient(0deg,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.34) 2px, rgba(0,0,0,0.34) 3px);
    opacity: 0.7;
    animation: crtFlicker 2.4s infinite ease-in-out;
  }

  @keyframes crtFlicker {
    0%   { opacity: 0.66; }
    50%  { opacity: 0.74; }
    100% { opacity: 0.66; }
  }

  /* slow rolling vertical-hold bar */
  .rollbar {
    position: absolute;
    left: 0; right: 0;
    height: 170px;
    top: -170px;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(255,255,255,0) 0%,
      rgba(220,228,236,0.04) 38%,
      rgba(235,240,248,0.08) 50%,
      rgba(220,228,236,0.04) 62%,
      rgba(255,255,255,0) 100%);
    animation: roll 9s linear infinite;
  }

  @keyframes roll {
    from { transform: translateY(0); }
    to   { transform: translateY(calc(100vh + 340px)); }
  }

  /* tube curvature: vignette + faint glass highlight */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background:
      radial-gradient(ellipse 58% 40% at 38% 22%,
        rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 60%),
      radial-gradient(ellipse 82% 82% at 50% 50%,
        rgba(0,0,0,0) 42%, rgba(0,0,0,0.85) 100%);
  }

  /* ---------- dice ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 150px;
  }

  .scene {
    width: 120px;
    height: 120px;
    perspective: 1300px;          /* perspective must sit on the die's direct parent */
    perspective-origin: 50% 50%;
  }

  .die {
    position: relative;
    width: 120px;
    height: 120px;
    transform-style: preserve-3d;
    transform: rotateX(0deg) rotateY(0deg);
  }

  .face {
    position: absolute;
    top: -1px;
    left: -1px;
    width: 122px;          /* 1px overhang on each side hides the cube seams */
    height: 122px;
    border-radius: 5px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 17px;
    backface-visibility: hidden;
  }

  .pip {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    align-self: center;
    justify-self: center;
  }

  /* ---- black die, white pips ---- */
  .die.black .face {
    background: linear-gradient(145deg, #3e3e45 0%, #252529 55%, #16161a 100%);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow:
      inset 0 0 22px rgba(0,0,0,0.5),
      inset 0 2px 6px rgba(255,255,255,0.10);
  }
  .die.black .pip {
    background: radial-gradient(circle at 35% 30%, #ffffff, #d2d2d2 68%, #9c9c9c);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.35), 0 0 5px rgba(210,210,210,0.4);
  }

  /* ---- white die, black pips ---- */
  .die.white .face {
    background: linear-gradient(145deg, #e9e9ec 0%, #c4c4c9 58%, #9c9ca2 100%);
    border: 1px solid #5a5a5e;
    box-shadow:
      inset 0 0 24px rgba(0,0,0,0.30),
      inset 0 2px 6px rgba(255,255,255,0.5);
  }
  .die.white .pip {
    background: radial-gradient(circle at 35% 30%, #3a3a3d, #0c0c0e 75%);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
  }

  /* pip grid positions */
  .pip.tl { grid-area: 1 / 1; }
  .pip.tr { grid-area: 1 / 3; }
  .pip.ml { grid-area: 2 / 1; }
  .pip.mc { grid-area: 2 / 2; }
  .pip.mr { grid-area: 2 / 3; }
  .pip.bl { grid-area: 3 / 1; }
  .pip.br { grid-area: 3 / 3; }

  /* cube face placement */
  .face.f1 { transform: rotateY(0deg)   translateZ(60px); } /* front */
  .face.f6 { transform: rotateY(180deg) translateZ(60px); } /* back */
  .face.f3 { transform: rotateY(90deg)  translateZ(60px); } /* right */
  .face.f4 { transform: rotateY(-90deg) translateZ(60px); } /* left */
  .face.f2 { transform: rotateX(90deg)  translateZ(60px); } /* top */
  .face.f5 { transform: rotateX(-90deg) translateZ(60px); } /* bottom */

  /* roll again button */
  #rollBtn {
    position: fixed;
    bottom: 42px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 10;
    padding: 14px 34px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: lowercase;
    color: #d7dadf;
    background: rgba(18,20,22,0.85);
    border: 1px solid rgba(150, 160, 170, 0.3);
    border-radius: 0;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease, transform 0.9s ease, box-shadow 0.4s ease, color 0.4s ease;
    box-shadow: 0 0 14px rgba(120,140,160,0.1), inset 0 0 10px rgba(0,0,0,0.5);
    text-shadow: 0 0 7px rgba(180,200,220,0.35);
  }
  #rollBtn.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  #rollBtn:hover {
    color: #ffffff;
    box-shadow: 0 0 22px rgba(150,180,210,0.3), inset 0 0 10px rgba(0,0,0,0.5);
    border-color: rgba(190, 205, 220, 0.55);
  }
  #rollBtn:active { transform: translateX(-50%) translateY(1px); }
</style>
</head>
<body>
  <div class="tube">
    <canvas id="feed"></canvas>
    <div class="rollbar"></div>
    <div class="crt"></div>
  </div>
  <div class="vignette"></div>

  <div class="stage">
    <div class="scene"><div class="die black" id="dieBlack"></div></div>
    <div class="scene"><div class="die white" id="dieWhite"></div></div>
  </div>

  <button id="rollBtn">roll again</button>

<script>
  /* ---------- grey camcorder feed on a CRT ---------- */
  const canvas = document.getElementById('feed');
  const ctx = canvas.getContext('2d');
  const PIX = 4;                       // pixel block size on screen
  let small, sctx, img, buf, sw, sh, w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    sw = Math.ceil(w / PIX);
    sh = Math.ceil(h / PIX);
    small = document.createElement('canvas');
    small.width = sw; small.height = sh;
    sctx = small.getContext('2d');
    img = sctx.createImageData(sw, sh);
    buf = new Float32Array(sw * sh).map(() => Math.random() * 255);
    ctx.imageSmoothingEnabled = false;
  }
  resize();
  window.addEventListener('resize', resize);

  let last = 0;
  function feed(t) {
    requestAnimationFrame(feed);
    if (t - last < 45) return;         // gentle live-feed update rate
    last = t;

    const data = img.data;
    for (let i = 0; i < buf.length; i++) {
      // temporal smoothing -> shimmer, not harsh static
      buf[i] = buf[i] * 0.80 + (Math.random() * 255) * 0.20;
      // low-contrast dark-grey "blank feed"
      const g = 26 + buf[i] * 0.22;
      const p = i * 4;
      data[p] = g; data[p + 1] = g; data[p + 2] = g; data[p + 3] = 255;
    }
    sctx.putImageData(img, 0, 0);

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, sw, sh, 0, 0, w, h);
  }
  requestAnimationFrame(feed);

  /* ---------- dice ---------- */
  const PIP_LAYOUTS = {
    1: ['mc'],
    2: ['tl', 'br'],
    3: ['tl', 'mc', 'br'],
    4: ['tl', 'tr', 'bl', 'br'],
    5: ['tl', 'tr', 'mc', 'bl', 'br'],
    6: ['tl', 'tr', 'ml', 'mr', 'bl', 'br'],
  };

  // rotation that brings a given value-face flat to the front (toward camera)
  const FACE_ROTATION = {
    1: { x: 0,   y: 0 },
    6: { x: 0,   y: 180 },
    3: { x: 0,   y: -90 },
    4: { x: 0,   y: 90 },
    2: { x: -90, y: 0 },
    5: { x: 90,  y: 0 },
  };

  function buildFaces(dieEl) {
    for (let v = 1; v <= 6; v++) {
      const face = document.createElement('div');
      face.className = 'face f' + v;
      for (const pos of PIP_LAYOUTS[v]) {
        const pip = document.createElement('div');
        pip.className = 'pip ' + pos;
        face.appendChild(pip);
      }
      dieEl.appendChild(face);
    }
  }

  const black = document.getElementById('dieBlack');
  const white = document.getElementById('dieWhite');
  const btn = document.getElementById('rollBtn');

  buildFaces(black);
  buildFaces(white);

  // accumulate turns so each roll spins forward smoothly, then lands face-on
  const spin = {
    black: { dieEl: black, turnsX: 0, turnsY: 0 },
    white: { dieEl: white, turnsX: 0, turnsY: 0 },
  };

  function rollDie(s, value) {
    const base = FACE_ROTATION[value];
    s.turnsX += 3 + Math.floor(Math.random() * 3);   // 3-5 extra X turns
    s.turnsY += 3 + Math.floor(Math.random() * 3);   // 3-5 extra Y turns
    const targetX = base.x + s.turnsX * 360;
    const targetY = base.y + s.turnsY * 360;
    // random in-plane tilt so the die settles at a jaunty angle, still face-on
    const tiltZ = (Math.random() * 36) - 18;
    s.dieEl.style.transition = 'transform 1.7s cubic-bezier(0.18, 0.78, 0.22, 1)';
    s.dieEl.style.transform = `rotateZ(${tiltZ}deg) rotateX(${targetX}deg) rotateY(${targetY}deg)`;
  }

  let rolling = false;

  function rollBoth() {
    if (rolling) return;
    rolling = true;
    btn.classList.remove('show');

    const valBlack = Math.floor(Math.random() * 6) + 1;
    const valWhite = Math.floor(Math.random() * 6) + 1;

    rollDie(spin.black, valBlack);
    rollDie(spin.white, valWhite);

    setTimeout(() => {
      btn.classList.add('show');
      rolling = false;
    }, 1850);

    return { black: valBlack, white: valWhite };
  }

  btn.addEventListener('click', rollBoth);
  window.addEventListener('load', () => setTimeout(rollBoth, 350));
</script>
</body>
</html>
